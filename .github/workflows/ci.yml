name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fail if uv.lock is out of date instead of silently re-locking.
  UV_LOCKED: "1"

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install
        run: uv sync --all-groups

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy --python-version ${{ matrix.python-version }}

      - name: Pytest with coverage (>= 90%)
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  generated:
    name: Generated code is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install
        run: uv sync --all-groups

      - name: Sync client matches the async source (scripts/unasync.py)
        run: uv run python scripts/unasync.py --check

      - name: Models and operation table match openapi.json (scripts/generate_models.sh)
        run: scripts/generate_models.sh --check

  package:
    name: Build and install the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.14"

      - name: Build sdist and wheel
        run: uv build

      - name: Install the wheel into a clean environment and import it
        run: |
          uv venv --python 3.10 /tmp/wheel-env
          uv pip install --python /tmp/wheel-env dist/*.whl
          /tmp/wheel-env/bin/python - <<'EOF'
          import pathlib
          import agentbank
          from agentbank import AgentBank, AsyncAgentBank, X402Transport, verify_webhook
          package = pathlib.Path(agentbank.__file__).parent
          assert (package / "py.typed").exists(), "py.typed missing from the wheel"
          assert (package / "_sync" / "client.py").exists(), "generated sync client missing"
          print("agentbank", agentbank.__version__, "imports cleanly")
          EOF
