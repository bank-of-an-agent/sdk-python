name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.14"

      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/agentbank/_version.py)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi

      - name: Test before building
        run: |
          uv sync --locked
          uv run pytest -q

      - name: Build
        run: uv build

      - name: Smoke-test the wheel in a clean environment
        run: |
          uv venv --python 3.14 /tmp/wheel-env
          uv pip install --python /tmp/wheel-env dist/*.whl
          /tmp/wheel-env/bin/python -c "import agentbank; print(agentbank.__version__)"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Publishing uses PyPI trusted publishing (OpenID Connect): no API tokens are
  # stored anywhere. To enable it:
  #   1. On PyPI, add a trusted publisher for the project "agentbank":
  #      owner bank-of-an-agent, repository sdk-python, workflow release.yml,
  #      environment pypi.
  #   2. In GitHub, create the "pypi" environment (require a reviewer).
  #   3. Uncomment the job below.
  #
  # publish:
  #   name: Publish to PyPI
  #   needs: build
  #   runs-on: ubuntu-latest
  #   environment:
  #     name: pypi
  #     url: https://pypi.org/p/agentbank
  #   permissions:
  #     id-token: write
  #   steps:
  #     - uses: actions/download-artifact@v8
  #       with:
  #         name: dist
  #         path: dist/
  #     - uses: pypa/gh-action-pypi-publish@release/v1
